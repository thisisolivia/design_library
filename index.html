<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>RISE Design Library</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&family=Roboto+Mono:wght@400;500&display=swap" rel="stylesheet" />
  <style>
    /* ── DESIGN TOKENS ─────────────────────────────── */
    :root {
      /* Brand */
      --brand: #BF4646;
      --brand-dark: #A03B3B;
      --brand-light: #FCEAEA;
      --brand-muted: #F5D8D8;

      /* Surfaces */
      --bg: #F8F5F4;
      --surface: #FFFFFF;
      --surface-2: #F4EFEE;
      --surface-3: #EDE5E3;

      /* Borders */
      --border-1: #EAE1DF;
      --border-2: #D6CAC8;

      /* Text */
      --text-1: #1A1110;
      --text-2: #6B5B58;
      --text-3: #9E8D8A;

      /* Shadows */
      --shadow-sm: 0 1px 3px rgba(28,17,16,0.06), 0 1px 2px rgba(28,17,16,0.04);
      --shadow-md: 0 4px 16px rgba(28,17,16,0.09), 0 2px 4px rgba(28,17,16,0.04);
      --shadow-lg: 0 12px 40px rgba(28,17,16,0.12), 0 4px 12px rgba(28,17,16,0.06);

      /* Shape */
      --r-sm: 8px;
      --r-md: 12px;
      --r-lg: 16px;
      --r-xl: 20px;
      --r-2xl: 28px;
      --r-full: 9999px;

      /* Type */
      --font: 'Plus Jakarta Sans', sans-serif;
      --font-mono: 'Roboto Mono', monospace;

      /* Motion */
      --ease: cubic-bezier(0.2, 0, 0, 1);
      --dur: 160ms;
    }

    /* ── RESET & BASE ──────────────────────────────── */
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: var(--font);
      background: var(--bg);
      color: var(--text-1);
      min-height: 100vh;
      -webkit-font-smoothing: antialiased;
    }

    /* ── HEADER ────────────────────────────────────── */
    header {
      background: rgba(255,255,255,0.90);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border-bottom: 1px solid var(--border-1);
      padding: 0 32px;
      height: 58px;
      position: sticky;
      top: 0;
      z-index: 100;
      display: grid;
      grid-template-columns: auto 1fr auto;
      align-items: center;
      gap: 20px;
    }
    .header-brand { display: flex; align-items: center; gap: 10px; }
    .logo-mark {
      width: 28px; height: 28px;
      background: var(--brand);
      border-radius: 8px;
      display: flex; align-items: center; justify-content: center;
      flex-shrink: 0;
    }
    .logo-mark svg { width: 14px; height: 14px; fill: white; }
    .logo-text {
      font-size: 14px; font-weight: 700;
      color: var(--text-1);
      letter-spacing: -0.3px;
      white-space: nowrap;
    }
    .logo-text span { color: var(--brand); }
    .header-search {
      max-width: 380px; width: 100%;
      justify-self: center;
      position: relative;
    }
    .search-icon {
      position: absolute; left: 12px; top: 50%; transform: translateY(-50%);
      color: var(--text-3); pointer-events: none;
      width: 15px; height: 15px;
    }
    .search-input {
      width: 100%; height: 36px;
      background: var(--surface-2);
      border: 1px solid var(--border-1);
      border-radius: var(--r-full);
      padding: 0 14px 0 36px;
      font-family: var(--font);
      font-size: 13px; color: var(--text-1);
      transition: background var(--dur) var(--ease), border-color var(--dur) var(--ease), box-shadow var(--dur) var(--ease);
      outline: none;
    }
    .search-input::placeholder { color: var(--text-3); }
    .search-input:focus {
      background: var(--surface);
      border-color: var(--brand);
      box-shadow: 0 0 0 3px rgba(191,70,70,0.12);
    }
    .header-meta { display: flex; align-items: center; gap: 8px; }
    .badge {
      background: var(--surface-2);
      border: 1px solid var(--border-1);
      color: var(--text-2);
      font-size: 11px; font-weight: 600;
      padding: 3px 10px;
      border-radius: var(--r-full);
      white-space: nowrap;
    }

    /* ── HERO ───────────────────────────────────────── */
    .hero {
      max-width: 1280px;
      margin: 0 auto;
      padding: 52px 32px 28px;
    }
    .hero-eyebrow {
      display: inline-flex; align-items: center; gap: 7px;
      font-size: 11px; font-weight: 700;
      letter-spacing: 1px; text-transform: uppercase;
      color: var(--brand); margin-bottom: 16px;
    }
    .hero-eyebrow-dot {
      width: 5px; height: 5px;
      background: var(--brand); border-radius: 50%;
      animation: blink 2.4s ease-in-out infinite;
    }
    @keyframes blink {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.3; }
    }
    .hero-title {
      font-size: 38px; font-weight: 800;
      color: var(--text-1);
      letter-spacing: -1.2px;
      line-height: 1.1;
      margin-bottom: 14px;
    }
    .hero-desc {
      font-size: 15px;
      color: var(--text-2);
      line-height: 1.7;
      max-width: 440px;
    }

    /* ── FILTER BAR ─────────────────────────────────── */
    .filter-section {
      max-width: 1280px; margin: 0 auto;
      padding: 0 32px 28px;
    }
    .filter-bar {
      display: flex;
      gap: 6px;
      overflow-x: auto;
      scrollbar-width: none;
    }
    .filter-bar::-webkit-scrollbar { display: none; }
    .chip {
      display: inline-flex; align-items: center;
      padding: 7px 16px;
      border-radius: var(--r-full);
      border: 1px solid var(--border-1);
      background: var(--surface);
      color: var(--text-2);
      font-family: var(--font);
      font-size: 12.5px; font-weight: 600;
      cursor: pointer;
      transition: all var(--dur) var(--ease);
      white-space: nowrap;
      letter-spacing: 0.1px;
    }
    .chip:hover {
      background: var(--surface-2);
      border-color: var(--border-2);
      color: var(--text-1);
    }
    .chip.active {
      background: var(--brand);
      color: #fff;
      border-color: transparent;
      box-shadow: 0 2px 8px rgba(191,70,70,0.28);
    }

    /* ── MAIN GRID ─────────────────────────────────── */
    main {
      max-width: 1280px;
      margin: 0 auto;
      padding: 0 32px 72px;
    }
    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
      gap: 18px;
    }
    .empty-state {
      grid-column: 1 / -1;
      text-align: center;
      padding: 80px 24px;
      color: var(--text-3);
    }
    .empty-state-icon { font-size: 36px; margin-bottom: 14px; opacity: 0.35; }
    .empty-state p { font-size: 14px; line-height: 1.65; color: var(--text-2); }

    /* ── CARD ──────────────────────────────────────── */
    .card {
      background: var(--surface);
      border-radius: var(--r-xl);
      border: 1px solid var(--border-1);
      overflow: hidden;
      display: flex;
      flex-direction: column;
      cursor: pointer;
      transition:
        box-shadow var(--dur) var(--ease),
        border-color var(--dur) var(--ease),
        transform var(--dur) var(--ease);
    }
    .card:hover {
      box-shadow: var(--shadow-md);
      border-color: var(--border-2);
      transform: translateY(-2px);
    }

    /* Preview area */
    .card-preview {
      position: relative;
      height: 216px;
      background: var(--bg);
      overflow: hidden;
      flex-shrink: 0;
    }
    .card-preview iframe {
      border: none;
      pointer-events: none;
      position: absolute;
      width: 125%;
      height: 360px;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%) scale(0.8);
      transform-origin: center center;
    }
    .preview-overlay {
      position: absolute; inset: 0;
      display: flex; align-items: center; justify-content: center;
      background: rgba(15,8,7,0.28);
      opacity: 0;
      transition: opacity var(--dur) var(--ease);
    }
    .card:hover .preview-overlay { opacity: 1; }
    .preview-btn {
      background: rgba(255,255,255,0.18);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border: 1px solid rgba(255,255,255,0.32);
      border-radius: var(--r-full);
      color: #fff;
      font-family: var(--font);
      font-size: 13px; font-weight: 600;
      padding: 9px 22px;
      cursor: pointer;
      letter-spacing: 0.1px;
    }

    /* Card body */
    .card-body {
      padding: 15px 17px 17px;
      flex: 1; display: flex; flex-direction: column; gap: 8px;
      border-top: 1px solid var(--border-1);
    }
    .card-header-row { display: flex; align-items: flex-start; justify-content: space-between; gap: 8px; }
    .card-title { font-size: 13.5px; font-weight: 700; color: var(--text-1); line-height: 1.3; letter-spacing: -0.1px; }
    .cat-chip {
      font-size: 10px; font-weight: 700; letter-spacing: 0.4px; text-transform: uppercase;
      padding: 3px 8px;
      border-radius: var(--r-full);
      white-space: nowrap;
      flex-shrink: 0;
      line-height: 1.6;
    }
    .card-desc { font-size: 12.5px; color: var(--text-2); line-height: 1.6; flex: 1; }
    .card-footer { display: flex; align-items: center; justify-content: flex-end; padding-top: 2px; }
    .view-btn {
      display: inline-flex; align-items: center; gap: 5px;
      font-family: var(--font);
      font-size: 12px; font-weight: 700;
      color: var(--brand);
      background: var(--brand-light);
      border: none;
      border-radius: var(--r-full);
      padding: 5px 12px;
      cursor: pointer;
      transition: background var(--dur) var(--ease);
      letter-spacing: 0.1px;
    }
    .view-btn:hover { background: var(--brand-muted); }

    /* Category colours */
    .cat-transition  { background: rgba(59,130,246,0.09);  color: #1D4ED8; }
    .cat-animation   { background: rgba(124,58,237,0.09);  color: #6D28D9; }
    .cat-interaction { background: rgba(16,185,129,0.09);  color: #047857; }
    .cat-layout      { background: rgba(217,119,6,0.09);   color: #92400E; }
    .cat-other       { background: rgba(107,114,128,0.09); color: #374151; }

    /* ── BUTTONS ───────────────────────────────────── */
    .btn {
      display: inline-flex; align-items: center; gap: 5px;
      padding: 7px 16px;
      border-radius: var(--r-full);
      font-family: var(--font);
      font-size: 13px; font-weight: 600;
      cursor: pointer;
      transition: all var(--dur) var(--ease);
      border: none;
      text-decoration: none;
      letter-spacing: 0.1px;
    }
    .btn-tonal {
      background: var(--surface-2);
      color: var(--text-1);
      border: 1px solid var(--border-1);
    }
    .btn-tonal:hover { background: var(--surface-3); border-color: var(--border-2); }
    .btn-icon {
      background: transparent;
      border: 1px solid var(--border-1);
      color: var(--text-2);
      padding: 7px 10px;
      border-radius: var(--r-full);
      font-size: 14px; line-height: 1;
    }
    .btn-icon:hover { background: var(--surface-2); border-color: var(--border-2); }

    /* ── MODAL ─────────────────────────────────────── */
    .modal-backdrop {
      position: fixed; inset: 0;
      background: rgba(15,8,7,0.50);
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      z-index: 200;
      display: flex; align-items: center; justify-content: center;
      padding: 16px;
      opacity: 0; pointer-events: none;
      transition: opacity var(--dur) var(--ease);
    }
    .modal-backdrop.open { opacity: 1; pointer-events: all; }
    .modal {
      background: var(--surface);
      border-radius: var(--r-2xl);
      border: 1px solid var(--border-1);
      box-shadow: var(--shadow-lg);
      width: 100%; max-width: 880px;
      max-height: 90vh;
      display: flex; flex-direction: column;
      transform: translateY(16px) scale(0.98);
      transition: transform 240ms cubic-bezier(0.34, 1.56, 0.64, 1);
      overflow: hidden;
    }
    .modal-backdrop.open .modal { transform: translateY(0) scale(1); }
    .modal-header {
      display: flex; align-items: center; justify-content: space-between;
      padding: 16px 24px;
      border-bottom: 1px solid var(--border-1);
      flex-shrink: 0;
    }
    .modal-title { font-size: 15px; font-weight: 700; letter-spacing: -0.2px; color: var(--text-1); }
    .modal-body { display: flex; flex-direction: column; overflow: hidden; flex: 1; }
    .modal-preview {
      height: 390px; flex-shrink: 0;
      border-bottom: 1px solid var(--border-1);
      background: var(--bg);
      position: relative;
    }
    .modal-preview iframe { width: 100%; height: 100%; border: none; }
    .modal-code-section { display: flex; flex-direction: column; flex: 1; overflow: hidden; }
    .modal-code-header {
      display: flex; align-items: center; justify-content: space-between;
      padding: 10px 24px;
      border-bottom: 1px solid var(--border-1);
      flex-shrink: 0;
      background: var(--surface);
    }
    .modal-code-label { font-size: 13px; font-weight: 500; color: var(--text-2); }
    .code-block {
      flex: 1; overflow-y: auto;
      padding: 20px 24px;
      background: var(--surface-3);
    }
    .code-block pre {
      font-family: var(--font-mono);
      font-size: 12.5px;
      line-height: 1.75;
      color: var(--text-1);
      white-space: pre;
      overflow-x: auto;
    }
    .copy-success { color: #059669; font-size: 13px; font-weight: 600; }

    /* ── MODAL TABS ────────────────────────────────── */
    .modal-tabs { display: flex; gap: 2px; }
    .modal-tab {
      background: transparent;
      border: none;
      border-bottom: 2px solid transparent;
      padding: 4px 12px;
      font-family: var(--font);
      font-size: 13px; font-weight: 600;
      color: var(--text-2);
      cursor: pointer;
      transition: all var(--dur) var(--ease);
    }
    .modal-tab.active {
      color: var(--brand);
      border-bottom-color: var(--brand);
    }
    .instructions-block {
      display: none;
      flex: 1; overflow-y: auto;
      padding: 20px 24px;
      background: var(--surface-3);
      flex-direction: column; gap: 20px;
    }
    .instructions-block.visible { display: flex; }
    .instr-section { display: flex; flex-direction: column; gap: 6px; }
    .instr-title { font-size: 13px; font-weight: 700; color: var(--text-1); }
    .instr-desc  { font-size: 13px; color: var(--text-2); line-height: 1.55; }
    .instr-example {
      background: var(--surface-2);
      border: 1px solid var(--border-1);
      border-radius: var(--r-sm);
      padding: 10px 14px;
      font-family: var(--font-mono);
      font-size: 12px;
      color: var(--text-1);
      line-height: 1.7;
    }
    .instr-example code { font-family: inherit; }



    /* ── SCROLLBAR ─────────────────────────────────── */
    ::-webkit-scrollbar { width: 6px; height: 6px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: var(--border-2); border-radius: 3px; }

    /* ── RESPONSIVE ────────────────────────────────── */
    @media (max-width: 640px) {
      header { padding: 0 16px; grid-template-columns: auto 1fr; }
      .header-meta { display: none; }
      .header-search { max-width: none; }
      .hero, .filter-section, main { padding-left: 16px; padding-right: 16px; }
      .hero-title { font-size: 28px; }
      .grid { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>

  <!-- HEADER -->
  <header>
    <div class="header-brand">
      <div class="logo-mark">
        <svg viewBox="0 0 14 14" xmlns="http://www.w3.org/2000/svg">
          <rect x="1" y="1" width="5" height="5" rx="1.5"/>
          <rect x="8" y="1" width="5" height="5" rx="1.5"/>
          <rect x="1" y="8" width="5" height="5" rx="1.5"/>
          <rect x="8" y="8" width="5" height="3" rx="1.5"/>
        </svg>
      </div>
      <span class="logo-text">RISE <span>Design Library</span></span>
    </div>
    <div class="header-search">
      <svg class="search-icon" viewBox="0 0 16 16" fill="none" xmlns="http://www.w3.org/2000/svg">
        <circle cx="7" cy="7" r="4.5" stroke="currentColor" stroke-width="1.5"/>
        <path d="M10.5 10.5L13.5 13.5" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
      </svg>
      <input type="text" class="search-input" id="search-input" placeholder="Search blocks…" autocomplete="off">
    </div>
    <div class="header-meta">
      <span class="badge" id="badge-count">0 blocks</span>
    </div>
  </header>

  <!-- HERO -->
  <div class="hero">
    <div class="hero-eyebrow"><span class="hero-eyebrow-dot"></span>Articulate RISE</div>
    <h1 class="hero-title">Ready-to-use<br>HTML code blocks</h1>
    <p class="hero-desc">Copy, paste, and publish — no coding required. Built for L&amp;D teams using Articulate RISE.</p>
  </div>

  <!-- FILTER BAR -->
  <div class="filter-section">
    <div class="filter-bar" id="filter-bar">
      <button class="chip active" data-filter="all">All</button>
      <button class="chip" data-filter="transition">Transition</button>
      <button class="chip" data-filter="animation">Animation</button>
      <button class="chip" data-filter="interaction">Interaction</button>
      <button class="chip" data-filter="other">Other</button>
    </div>
  </div>

  <!-- MAIN GRID -->
  <main>
    <div class="grid" id="grid"></div>
  </main>

  <!-- VIEW CODE MODAL -->
  <div class="modal-backdrop" id="view-modal" onclick="handleBackdropClick(event, 'view-modal')">
    <div class="modal">
      <div class="modal-header">
        <span class="modal-title" id="modal-title">Block Name</span>
        <button class="btn btn-icon" onclick="closeModal('view-modal')">✕</button>
      </div>
      <div class="modal-body">
        <div class="modal-preview">
          <iframe id="modal-iframe" title="Preview"></iframe>
        </div>
        <div class="modal-code-section">
          <div class="modal-code-header">
            <div class="modal-tabs">
              <button class="modal-tab active" onclick="switchTab('code')">HTML</button>
              <button class="modal-tab" onclick="switchTab('instructions')">Instructions</button>
            </div>
            <button class="btn btn-tonal" id="copy-btn" onclick="copyCode()">
              <svg width="14" height="14" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg" style="flex-shrink:0"><rect x="9" y="9" width="13" height="13" rx="2" stroke="currentColor" stroke-width="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
              Copy Code
            </button>
          </div>
          <div class="code-block" id="tab-code">
            <pre id="modal-code"></pre>
          </div>
          <div class="instructions-block" id="tab-instructions"></div>
        </div>
      </div>
    </div>
  </div>



  <script>
    // ── DATA ──────────────────────────────────────────────────────────────────
    const SEED_BLOCKS = [
      {
        id: 'seed-1',
        title: 'Scallop Divider',
        category: 'transition',
        description: 'A scalloped bottom edge to transition between sections. Paste at the end of a content block.',
        code: `<!DOCTYPE html>
<html>
<head>
<style>

  /* ============================================
     CUSTOMIZE HERE
     ============================================ */

  :root {
    --scallop-color: #547792; /* ✏️ Scallop color */
    --scallop-size:  48px;    /* ✏️ Radius of each bump — bigger = larger scallops */
    --solid-height:  32px;    /* ✏️ Height of the solid strip above the bumps */
    /* 💡 The background behind the scallop is transparent —
          it will automatically show your RISE block background color */
  }

  /* ============================================
     DO NOT EDIT BELOW THIS LINE
     ============================================ */

  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: transparent;
    overflow: hidden;
    display: flex;
    flex-direction: column;
    justify-content: center;
    min-height: 100vh;
  }

  .scallop {
    width: 100%;
    height: calc(var(--scallop-size) + var(--solid-height));
    background:
      radial-gradient(
        circle at 50% 100%,
        transparent calc(var(--scallop-size) - 0.5px),
        var(--scallop-color) var(--scallop-size)
      )
      center bottom / calc(var(--scallop-size) * 2) calc(var(--scallop-size) + var(--solid-height))
      repeat-x,

      linear-gradient(
        to bottom,
        var(--scallop-color) var(--solid-height),
        transparent var(--solid-height)
      );
  }

</style>
</head>
<body>
  <div class="scallop"></div>
</body>
</html>`
      },
      {
        id: 'seed-2',
        title: 'Animated Wave',
        category: 'transition',
        description: 'A smoothly animated wave edge to transition between sections.',
        code: `<!DOCTYPE html>
<html>
<head>
<style>

  /* ============================================
     CUSTOMIZE HERE
     ============================================ */

  :root {
    --wave-color:  #547792; /* ✏️ Wave color */
    --wave-height: 260px;   /* ✏️ Height of the wave block */
    --wave-speed:  6s;      /* ✏️ Animation speed — lower = faster */
    /* 💡 The background behind the wave is transparent —
          it will automatically show your RISE block background color */
  }

  /* ============================================
     DO NOT EDIT BELOW THIS LINE
     ============================================ */

  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: transparent; /* The area behind the wave shows your RISE page background automatically */
    min-height: 100vh;
    display: flex;
    align-items: center;
  }

  .wave-container {
    position: relative;
    width: 100%;
    height: var(--wave-height);
    overflow: hidden;
  }

  svg.wave {
    position: absolute;
    bottom: 0; left: 0;
    width: 100%; height: 100%;

<canvas id="c"></canvas>
<script>
  var canvas = document.getElementById('c');
  var ctx    = canvas.getContext('2d');

  function resize() {
    canvas.width  = canvas.offsetWidth  || window.innerWidth;
    canvas.height = canvas.offsetHeight || parseInt(HEIGHT);
  }
  resize();
  window.addEventListener('resize', resize);

  function rand(a, b) { return a + Math.random() * (b - a); }

  var hex = COLOR.replace('#', '');
  var cr  = parseInt(hex.slice(0, 2), 16);
  var cg  = parseInt(hex.slice(2, 4), 16);
  var cb  = parseInt(hex.slice(4, 6), 16);

  var particles = [];
  for (var i = 0; i < COUNT; i++) {
    particles.push({
      x:  rand(0, canvas.width),
      y:  rand(0, canvas.height),
      r:  rand(MIN_R, MAX_R),
      vx: rand(-MAX_SPEED, MAX_SPEED) * 0.4,
      vy: -rand(MIN_SPEED, MAX_SPEED),
      a:  rand(0.05, OPACITY),
    });
  }

  function draw() {
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    for (var i = 0; i < particles.length; i++) {
      var p = particles[i];
      p.x += p.vx;
      p.y += p.vy;
      if (p.y + p.r < 0)            p.y = canvas.height + p.r;
      if (p.x + p.r < 0)            p.x = canvas.width  + p.r;
      if (p.x - p.r > canvas.width) p.x = -p.r;
      ctx.beginPath();
      ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2);
      ctx.fillStyle = 'rgba(' + cr + ',' + cg + ',' + cb + ',' + p.a + ')';
      ctx.fill();
